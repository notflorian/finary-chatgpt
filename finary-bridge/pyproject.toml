[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finary-bridge"
version = "2.0.0"
description = "Stable local bridge between Finary and downstream portfolio tooling."
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "jsonschema>=4.23,<5.0",
  "fastapi>=0.115,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-xdist>=3.8,<4.0",
  "ruff>=0.6,<1.0",
  "types-jsonschema>=4.23",
  "build>=1.2,<2",
]

[tool.setuptools]
packages = ["app", "app.services"]

[tool.setuptools.package-data]
app = ["mcp-contract.json", "workbook-schema.json"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "live: opt-in tests that contact Finary using explicitly authorized isolated state",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
strict = true
warn_unused_ignores = true
