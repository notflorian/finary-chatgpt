name: Copilot Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Copilot review is managed by GitHub
        run: echo "Copilot review requests are handled by GitHub's built-in reviewer workflow."
