name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Report runtime versions
        working-directory: finary-bridge
        run: |
          python --version
          node --version
      - name: Install development dependencies
        working-directory: finary-bridge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run credential-free tests
        working-directory: finary-bridge
        run: python -m pytest -m "not live" --ignore=tests/live

  session-validation-python314:
    name: session-validation-python314
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - name: Install development dependencies
        working-directory: finary-bridge
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check session validation compatibility
        working-directory: finary-bridge
        run: python -m pytest -q -m "not live" --ignore=tests/live tests/test_session_state_validation.py

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install development dependencies
        working-directory: finary-bridge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Ruff
        working-directory: finary-bridge
        run: python -m ruff check .
      - name: Run mypy
        working-directory: finary-bridge
        run: python -m mypy app

  repository-contracts:
    name: repository-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Validate canonical JSON
        run: python scripts/validate-json.py
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  n8n-import:
    name: n8n-import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Import-validate workflows with Compose-pinned n8n
        run: bash scripts/validate-n8n-imports.sh
      - name: Set up Python for isolated runtime regressions
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Set up Node.js for fixture preparation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Install synthetic test dependencies
        run: python -m pip install -e "./finary-bridge[dev]"
      - name: Pre-pull Compose-pinned n8n image for parallel runtime tests
        run: |
          n8n_images="$(docker compose config --images | awk '/^n8nio\/n8n:/{print}')"
          n8n_image_count="$(printf '%s\n' "$n8n_images" | awk 'NF { count += 1 } END { print count + 0 }')"
          if [[ "$n8n_image_count" != "1" ]]; then
            echo "Expected exactly one Compose-pinned n8n image; found $n8n_image_count." >&2
            exit 1
          fi
          n8n_image="$(printf '%s\n' "$n8n_images" | awk 'NF { print; exit }')"
          docker pull "$n8n_image" >/dev/null
      - name: Execute prewrite validation and zero-position paths in isolated pinned n8n
        env:
          FINARY_REQUIRE_N8N_RUNTIME: "1"
        run: >-
          python -m pytest -q -n auto --maxprocesses 4 --dist worksteal --max-worker-restart 0 --durations=15
          finary-bridge/tests/test_n8n_zero_position_runtime.py
          finary-bridge/tests/test_restore_run_identity_runtime.py
          finary-bridge/tests/test_sheets_connector_runtime.py
